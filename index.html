<!DOCTYPE html>
<html lang="id" class="h-full w-full overflow-hidden select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SITMET.ea - Arcade Web Games</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK & Inisialisasi Database -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // Konfigurasi Firebase Kamu
    const firebaseConfig = {
      apiKey: "AIzaSyA5mclNoOdDtrKMTLRduBMkEJArqsPtTb0",
      authDomain: "sitmet-arcade.firebaseapp.com",
      projectId: "sitmet-arcade",
      storageBucket: "sitmet-arcade.firebasestorage.app",
      messagingSenderId: "186602502454",
      appId: "1:186602502454:web:0a9a7e67ae64fc61839b97",
      measurementId: "G-9SQ48YKYVR"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Ekspos variabel agar bisa diakses fungsi global
    window.db = db;
    window.colRef = collection(db, "feedbacks");
  </script>

  <!-- Google Fonts: Fredoka & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { fredoka: ['Fredoka', 'sans-serif'], quicksand: ['Quicksand', 'sans-serif'] },
          colors: { gameBlue: '#3B82F6', gameDarkBlue: '#1D4ED8', gameYellow: '#FACC15', gameRed: '#EF4444', gameBg: '#EFF6FF' },
          boxShadow: { 'pop': '0px 6px 0px 0px #1D4ED8', 'pop-sm': '0px 3px 0px 0px #1D4ED8', 'pop-yellow': '0px 6px 0px 0px #CA8A04', 'pop-red': '0px 5px 0px 0px #991B1B' }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Quicksand', sans-serif; touch-action: manipulation; height: 100dvh; width: 100vw; overflow: hidden; background-color: #EFF6FF; }
    .font-cartoon { font-family: 'Fredoka', sans-serif; }
    .cartoon-border { border: 3px solid #1D4ED8; }
    .cartoon-border-sm { border: 2px solid #1D4ED8; }
    .btn-pop { transition: all 0.1s ease; }
    .btn-pop:active { transform: translateY(4px); box-shadow: 0px 1px 0px 0px transparent !important; }
    .catalog-scroll::-webkit-scrollbar { width: 6px; }
    .catalog-scroll::-webkit-scrollbar-track { background: #DBEAFE; border-radius: 10px; }
    .catalog-scroll::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; border: 1px solid #1D4ED8; }
    .modal-backdrop { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); }
  </style>
</head>
<body class="flex flex-col justify-between items-center text-slate-800 p-3 max-w-md mx-auto relative h-full">

  <!-- TOP HEADER -->
  <header class="w-full bg-gameBlue text-white rounded-2xl p-2.5 px-4 flex justify-between items-center cartoon-border shadow-pop flex-shrink-0 z-20">
    <!-- KLIK LOGO 5x UNTUK MASUK ADMIN -->
    <div class="flex items-center gap-2 cursor-pointer" onclick="triggerAdminSecret()" title="Klik 5x untuk Admin">
      <span class="text-xl">🎮</span>
      <h1 class="font-cartoon text-lg font-bold tracking-wider text-gameYellow">SITMET.ea</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openInfoModal()" class="p-1.5 px-2.5 bg-blue-600 rounded-xl border-2 border-blue-300 text-xs font-bold">📢</button>
      <button id="soundToggleBtn" onclick="toggleSound()" class="p-1.5 px-2 bg-blue-600 rounded-xl border-2 border-blue-300 text-xs font-bold">🔊</button>
    </div>
  </header>

  <!-- WELCOME SCREEN -->
  <main id="welcomeScreen" class="w-full flex-1 flex flex-col justify-between items-center my-3 overflow-hidden z-10">
    <div class="my-auto text-center flex flex-col items-center px-4">
      <div class="w-24 h-24 bg-gameYellow rounded-3xl cartoon-border flex items-center justify-center text-5xl shadow-pop mb-4">🕹️</div>
      <h1 class="font-cartoon text-4xl font-black text-gameDarkBlue tracking-wider mb-1">SITMET<span class="text-gameYellow">.ea</span></h1>
      <p class="text-xs font-bold text-slate-600 px-6">Kumpulan mini game seru dan imut untuk dimainkan bareng teman-teman!</p>
    </div>
    <button onclick="goToGameCatalog()" class="btn-pop w-full bg-gameYellow text-gameDarkBlue font-cartoon font-black text-xl py-4 rounded-2xl cartoon-border shadow-pop-yellow uppercase flex items-center justify-center gap-2">🚀 MULAI GAME</button>
  </main>

  <!-- CATALOG SCREEN (6 GAMES) -->
  <main id="catalogScreen" class="w-full flex-1 flex-col justify-between items-center my-2 hidden overflow-hidden z-10">
    <div class="w-full text-center my-1 flex-shrink-0">
      <span class="text-[10px] font-black uppercase text-blue-600 tracking-widest bg-blue-100 px-3 py-1 rounded-full border">PILIH GAME FAVORITMU</span>
    </div>
    <div class="w-full flex-1 overflow-y-auto catalog-scroll pr-1 my-2">
      <div class="grid grid-cols-2 gap-3 pb-2">
        <button onclick="openRulesModal(1)" class="btn-pop bg-white rounded-2xl p-2.5 cartoon-border shadow-pop flex flex-col items-center justify-between h-36">
          <div class="w-full flex-1 rounded-xl bg-blue-400 cartoon-border-sm flex items-center justify-center text-3xl">🎨</div>
          <span class="font-cartoon text-xs font-black text-gameDarkBlue mt-2">COLOR HUNT</span>
        </button>
        <button onclick="openRulesModal(2)" class="btn-pop bg-white rounded-2xl p-2.5 cartoon-border shadow-pop flex flex-col items-center justify-between h-36">
          <div class="w-full flex-1 rounded-xl bg-amber-400 cartoon-border-sm flex items-center justify-center text-3xl">💣</div>
          <span class="font-cartoon text-xs font-black text-gameDarkBlue mt-2">BoomMath!</span>
        </button>
        <button onclick="openRulesModal(3)" class="btn-pop bg-white rounded-2xl p-2.5 cartoon-border shadow-pop flex flex-col items-center justify-between h-36">
          <div class="w-full flex-1 rounded-xl bg-emerald-400 cartoon-border-sm flex items-center justify-center text-3xl">🔎</div>
          <span class="font-cartoon text-xs font-black text-gameDarkBlue mt-2">Odd One Out</span>
        </button>
        <button onclick="openRulesModal(4)" class="btn-pop bg-white rounded-2xl p-2.5 cartoon-border shadow-pop flex flex-col items-center justify-between h-36">
          <div class="w-full flex-1 rounded-xl bg-purple-400 cartoon-border-sm flex items-center justify-center text-3xl">⚖️</div>
          <span class="font-cartoon text-xs font-black text-gameDarkBlue mt-2">Truth or Dare</span>
        </button>
        <button onclick="openRulesModal(5)" class="btn-pop bg-white rounded-2xl p-2.5 cartoon-border shadow-pop flex flex-col items-center justify-between h-36">
          <div class="w-full flex-1 rounded-xl bg-red-400 cartoon-border-sm flex items-center justify-center text-3xl">🪙</div>
          <span class="font-cartoon text-xs font-black text-gameDarkBlue mt-2">Steal the Coin</span>
        </button>
        <button onclick="openRulesModal(6)" class="btn-pop bg-white rounded-2xl p-2.5 cartoon-border shadow-pop flex flex-col items-center justify-between h-36">
          <div class="w-full flex-1 rounded-xl bg-cyan-400 cartoon-border-sm flex items-center justify-center text-3xl">🎰</div>
          <span class="font-cartoon text-xs font-black text-gameDarkBlue mt-2">Sketch Roulette</span>
        </button>
      </div>
    </div>
    <button onclick="goToWelcomeScreen()" class="btn-pop w-full bg-slate-200 text-slate-700 font-cartoon font-bold text-sm py-2 rounded-xl cartoon-border-sm">⬅️ KEMBALI</button>
  </main>

  <!-- MODAL: INFO & PENGEMBANG -->
  <div id="infoModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-xs rounded-3xl p-4 cartoon-border shadow-pop text-center flex flex-col items-center relative">
      <button onclick="closeInfoModal()" class="absolute -top-3 -right-3 w-9 h-9 bg-gameRed text-white font-cartoon font-black rounded-full cartoon-border-sm shadow-pop-red">✕</button>
      <div class="w-16 h-16 rounded-2xl bg-gameYellow cartoon-border flex items-center justify-center text-3xl mb-2 mt-1">👩‍💻</div>
      <h3 class="font-cartoon text-xl font-black text-gameDarkBlue uppercase">Tentang Pengembang</h3>
      <div class="w-full bg-blue-50 border-2 border-blue-200 rounded-2xl p-3 text-left space-y-1 mb-3 text-xs font-bold">
        <p class="text-gameDarkBlue">Amadea (2026)</p>
        <p class="text-blue-600">IG: @amadeaantikorosi</p>
      </div>
      <div class="w-full space-y-2">
        <button onclick="openFeedbackModal()" class="btn-pop w-full bg-gameYellow text-gameDarkBlue font-cartoon font-black text-sm py-2.5 rounded-2xl cartoon-border shadow-pop-yellow uppercase">💬 Kirim Feedback</button>
        <button onclick="openPlayerInbox()" class="btn-pop w-full bg-blue-100 text-gameDarkBlue font-cartoon font-bold text-xs py-2 rounded-xl cartoon-border-sm">📬 Cek Kotak Masuk Kamu</button>
      </div>
    </div>
  </div>

  <!-- MODAL: KIRIM FEEDBACK -->
  <div id="feedbackModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-xs rounded-3xl p-4 cartoon-border shadow-pop text-center flex flex-col items-center relative">
      <button onclick="closeFeedbackModal()" class="absolute -top-3 -right-3 w-9 h-9 bg-gameRed text-white font-cartoon font-black rounded-full cartoon-border-sm shadow-pop-red">✕</button>
      <h3 class="font-cartoon text-lg font-black text-gameDarkBlue uppercase mb-1">Kirim Feedback 💬</h3>
      <div class="w-full space-y-2 text-left mb-3">
        <input type="text" id="fbName" placeholder="Nama / Panggilan" class="w-full px-3 py-2 border-2 border-gameDarkBlue rounded-xl text-xs font-bold bg-blue-50">
        <textarea id="fbMessage" rows="3" placeholder="Tulis masukan game..." class="w-full px-3 py-2 border-2 border-gameDarkBlue rounded-xl text-xs font-bold bg-blue-50 resize-none"></textarea>
      </div>
      <button onclick="submitFeedback()" class="btn-pop w-full bg-gameYellow text-gameDarkBlue font-cartoon font-black text-sm py-2.5 rounded-2xl cartoon-border shadow-pop-yellow uppercase">Kirim Pesan 🚀</button>
    </div>
  </div>

  <!-- MODAL: KOTAK MASUK PEMAIN -->
  <div id="playerInboxModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-xs rounded-3xl p-4 cartoon-border shadow-pop text-center flex flex-col items-center relative">
      <button onclick="closePlayerInbox()" class="absolute -top-3 -right-3 w-9 h-9 bg-gameRed text-white font-cartoon font-black rounded-full cartoon-border-sm shadow-pop-red">✕</button>
      <h3 class="font-cartoon text-lg font-black text-gameDarkBlue uppercase mb-1">Kotak Masuk Kamu 📬</h3>
      <div id="inboxList" class="w-full max-h-48 overflow-y-auto space-y-2 text-left text-xs mb-3 pr-1">Memuat pesan...</div>
      <button onclick="closePlayerInbox()" class="btn-pop w-full bg-slate-200 text-slate-700 font-cartoon font-bold text-xs py-2 rounded-xl cartoon-border-sm">Tutup</button>
    </div>
  </div>

  <!-- MODAL: ADMIN PANEL -->
  <div id="adminModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-4 cartoon-border shadow-pop text-center flex flex-col items-center relative">
      <button onclick="closeAdminModal()" class="absolute -top-3 -right-3 w-9 h-9 bg-gameRed text-white font-cartoon font-black rounded-full cartoon-border-sm shadow-pop-red">✕</button>
      <h3 class="font-cartoon text-xl font-black text-gameDarkBlue uppercase mb-1">👑 Panel Admin Amadea</h3>
      <div id="adminFeedbackList" class="w-full max-h-60 overflow-y-auto space-y-3 text-left text-xs mb-3 pr-1">Memuat data cloud...</div>
      <button onclick="closeAdminModal()" class="btn-pop w-full bg-gameDarkBlue text-white font-cartoon font-bold text-xs py-2 rounded-xl cartoon-border-sm">Keluar</button>
    </div>
  </div>

  <!-- MODAL: CARA BERMAIN -->
  <div id="rulesModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-xs rounded-3xl p-4 cartoon-border shadow-pop text-center flex flex-col items-center relative">
      <button onclick="closeRulesModal()" class="absolute -top-3 -right-3 w-9 h-9 bg-gameRed text-white font-cartoon font-black rounded-full cartoon-border-sm shadow-pop-red">✕</button>
      <div id="modalIconBox" class="w-16 h-16 rounded-2xl cartoon-border flex items-center justify-center text-3xl mb-2 mt-1">🎨</div>
      <h3 id="modalGameTitle" class="font-cartoon text-xl font-black text-gameDarkBlue uppercase">NAMA GAME</h3>
      <div class="w-full bg-blue-50 border-2 border-blue-200 rounded-2xl p-3 my-3 text-left">
        <p id="modalGameDescription" class="text-xs font-bold text-slate-600 leading-relaxed"></p>
      </div>
      <button onclick="launchGame()" class="btn-pop w-full bg-gameYellow text-gameDarkBlue font-cartoon font-black text-base py-3 rounded-2xl cartoon-border shadow-pop-yellow uppercase">👍 MENGERTI</button>
    </div>
  </div>

  <!-- LOGIC SCRIPT & FIREBASE -->
  <script type="module">
    import { addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    let isSoundEnabled = true;
    window.toggleSound = () => { isSoundEnabled = !isSoundEnabled; };

    // Rahasia Admin (Klik logo 5x)
    let secretClicks = 0;
    window.triggerAdminSecret = () => {
      secretClicks++;
      if (secretClicks >= 5) {
        secretClicks = 0;
        let pin = prompt("Masukkan PIN Admin:");
        if (pin === "2026") {
          window.openAdminDashboard();
        } else {
          alert("PIN Salah!");
        }
      }
    };

    window.openInfoModal = () => document.getElementById('infoModal').classList.remove('hidden');
    window.closeInfoModal = () => document.getElementById('infoModal').classList.add('hidden');
    window.openFeedbackModal = () => { window.closeInfoModal(); document.getElementById('feedbackModal').classList.remove('hidden'); };
    window.closeFeedbackModal = () => document.getElementById('feedbackModal').classList.add('hidden');

    // Kirim Feedback ke Cloud Firebase
    window.submitFeedback = async () => {
      let name = document.getElementById('fbName').value.trim() || "Anonim";
      let msg = document.getElementById('fbMessage').value.trim();
      if (!msg) { alert("Pesan tidak boleh kosong!"); return; }

      try {
        const docRef = await addDoc(window.colRef, {
          name: name,
          message: msg,
          reply: "Belum dibalas oleh Amadea.",
          date: new Date().toLocaleDateString()
        });

        let myIds = JSON.parse(localStorage.getItem('my_fb_cloud_ids')) || [];
        myIds.push(docRef.id);
        localStorage.setItem('my_fb_cloud_ids', JSON.stringify(myIds));

        alert("Berhasil dikirim ke server Amadea! 🚀");
        document.getElementById('fbMessage').value = '';
        window.closeFeedbackModal();
      } catch (e) {
        alert("Gagal mengirim: " + e.message);
      }
    };

    // Pemain Cek Kotak Masuk dari Cloud
    window.openPlayerInbox = async () => {
      window.closeInfoModal();
      let inboxContainer = document.getElementById('inboxList');
      inboxContainer.innerHTML = 'Mengambil data dari server...';
      document.getElementById('playerInboxModal').classList.remove('hidden');

      try {
        const querySnapshot = await getDocs(window.colRef);
        let myIds = JSON.parse(localStorage.getItem('my_fb_cloud_ids')) || [];
        inboxContainer.innerHTML = '';

        let found = false;
        querySnapshot.forEach((documentSnapshot) => {
          if (myIds.includes(documentSnapshot.id)) {
            found = true;
            let f = documentSnapshot.data();
            inboxContainer.innerHTML += `
              <div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-2.5 space-y-1">
                <div class="flex justify-between text-[10px] text-slate-400 font-bold">
                  <span>Pesanmu:</span><span>${f.date}</span>
                </div>
                <p class="font-bold text-slate-700">"${f.message}"</p>
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-1.5 mt-1">
                  <span class="text-[10px] font-black text-amber-600 block">💬 Balasan Amadea:</span>
                  <p class="font-semibold text-slate-800 text-[11px]">${f.reply}</p>
                </div>
              </div>
            `;
          }
        });

        if (!found) {
          inboxContainer.innerHTML = `<p class="text-center text-slate-400 font-bold py-4">Belum ada pesan terkirim dari HP ini.</p>`;
        }
      } catch (e) {
        inboxContainer.innerHTML = `<p class="text-center text-red-500 font-bold">Gagal memuat pesan.</p>`;
      }
    };
    window.closePlayerInbox = () => document.getElementById('playerInboxModal').classList.add('hidden');

    // Dashboard Admin Amadea (Membaca semua feedback online)
    window.openAdminDashboard = async () => {
      let adminList = document.getElementById('adminFeedbackList');
      adminList.innerHTML = 'Memuat semua pesan pemain dari cloud...';
      document.getElementById('adminModal').classList.remove('hidden');

      try {
        const querySnapshot = await getDocs(window.colRef);
        adminList.innerHTML = '';

        if (querySnapshot.empty) {
          adminList.innerHTML = `<p class="text-center text-slate-400 font-bold py-6">Belum ada feedback masuk.</p>`;
          return;
        }

        querySnapshot.forEach((documentSnapshot) => {
          let f = documentSnapshot.data();
          let docId = documentSnapshot.id;
          adminList.innerHTML += `
            <div class="bg-blue-50 border-2 border-blue-300 rounded-xl p-2.5 space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="font-cartoon font-bold text-gameDarkBlue">${f.name}</span>
                <span class="text-[9px] text-slate-400 font-bold">${f.date}</span>
              </div>
              <p class="font-bold text-slate-700 bg-white p-2 rounded-lg border border-blue-100">${f.message}</p>
              <div class="flex gap-1.5 pt-1">
                <input type="text" id="reply-${docId}" value="${f.reply === "Belum dibalas oleh Amadea." ? "" : f.reply}" placeholder="Ketik balasan..." class="flex-1 px-2 py-1 border border-gameDarkBlue rounded-lg text-xs bg-white">
                <button onclick="window.sendReply('${docId}')" class="bg-gameYellow text-gameDarkBlue font-bold px-3 py-1 rounded-lg text-xs border border-gameDarkBlue">Balas</button>
              </div>
            </div>
          `;
        });
      } catch (e) {
        adminList.innerHTML = `<p class="text-center text-red-500 font-bold">Gagal koneksi ke database Firebase.</p>`;
      }
    };

    window.sendReply = async (docId) => {
      let replyText = document.getElementById(`reply-${docId}`).value.trim();
      if (!replyText) { alert("Balasan tidak boleh kosong!"); return; }

      try {
        const docRef = doc(window.db, "feedbacks", docId);
        await updateDoc(docRef, { reply: replyText });
        alert("Balasan berhasil dikirim secara online ke pemain! 🎯");
        window.openAdminDashboard();
      } catch (e) {
        alert("Gagal membalas: " + e.message);
      }
    };

    window.closeAdminModal = () => document.getElementById('adminModal').classList.add('hidden');

    // ================= 6 GAME DATA CONFIGURATION =================
    const GAMES_DATA = {
      1: { title: "COLOR HUNT", fileUrl: "colorhunt.html", icon: "🎨", description: "Cari benda di sekitarmu yang warnanya paling mirip!" },
      2: { title: "BoomMath!", fileUrl: "boommath.html", icon: "💣", description: "Jawab pertanyaan matematika cepat sebelum bom meledak!" },
      3: { title: "Odd One Out", fileUrl: "impostor.html", icon: "🔎", description: "Temukan siapa impostor di antara kalian." },
      4: { title: "Truth or Dare", fileUrl: "truth.html", icon: "⚖️", description: "Jawab jujur atau terima tantangan seru." },
      5: { title: "Steal The Coin", fileUrl: "steal.html", icon: "🪙", description: "Adu cepat mencuri koin saat suara Tuing." },
      6: { title: "Sketch Roulette", fileUrl: "sketch.html", icon: "🎰", description: "Gambar yang diperintahkan, tebak yang mencurigakan!" }
    };

    let selectedGameId = null;
    window.goToGameCatalog = () => { document.getElementById('welcomeScreen').classList.add('hidden'); document.getElementById('catalogScreen').classList.remove('hidden'); document.getElementById('catalogScreen').classList.add('flex'); };
    window.goToWelcomeScreen = () => { document.getElementById('catalogScreen').classList.add('hidden'); document.getElementById('catalogScreen').classList.remove('flex'); document.getElementById('welcomeScreen').classList.remove('hidden'); };
    window.openRulesModal = (gameId) => {
      selectedGameId = gameId; let game = GAMES_DATA[gameId];
      document.getElementById('modalGameTitle').innerText = game.title;
      document.getElementById('modalGameDescription').innerText = game.description;
      document.getElementById('modalIconBox').innerText = game.icon;
      document.getElementById('rulesModal').classList.remove('hidden');
    };
    window.closeRulesModal = () => document.getElementById('rulesModal').classList.add('hidden');
    window.launchGroup = () => {};
    window.launchGame = () => { if (selectedGameId && GAMES_DATA[selectedGameId]) window.location.href = GAMES_DATA[selectedGameId].fileUrl; };
  </script>
</body>
</html>
